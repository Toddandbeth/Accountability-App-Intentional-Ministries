name: Warm up app

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the Proxy lambda (hit a real page)
        run: curl -fsS --max-time 20 -o /dev/null https://app.intentionalministries.com/login
      - name: Keep Supabase warm
        run: curl -fsS --max-time 20 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://app.intentionalministries.com/api/cron/keepalive
